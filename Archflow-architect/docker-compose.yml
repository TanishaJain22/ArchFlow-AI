version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: archflow_postgres
    environment:
      POSTGRES_USER: archflow_user
      POSTGRES_PASSWORD: archflow_pass
      POSTGRES_DB: archflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
